name: Build Flutter App (Staging)

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Test connection to Flutter releases
        run: curl "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Explicitly specify a stable, existing Flutter version to avoid version detection errors
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'   
          channel: 'stable'
          architecture: x64

      # Add permissions fix for runner safety warnings
      - name: Fix Flutter SDK folder permission (safe.directory)
        run: git config --global --add safe.directory /opt/hostedtoolcache/flutter/3.19.0-stable-x64

      - name: Flutter Doctor (debugging)
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK for Staging
        run: flutter build apk --flavor staging -t lib/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: build/app/outputs/flutter-apk/app-staging-release.apk
