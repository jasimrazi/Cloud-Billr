name: Build Flutter App (Staging)

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Test connection to Flutter releases
        run: curl "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          architecture: x64

      - name: Fix Flutter SDK folder permission (safe.directory)
        run: git config --global --add safe.directory /opt/hostedtoolcache/flutter/3.32.8-stable-x64

      - name: Flutter Doctor (debugging)
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build APK for Staging
        run: flutter build apk --flavor staging -t lib/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk-v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-staging-release.apk

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: staging-v${{ steps.version.outputs.version }}
          release_name: Staging Release v${{ steps.version.outputs.version }}
          body: |
            Staging build from commit ${{ github.sha }}
            
            **Version:** ${{ steps.version.outputs.version }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: true

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-staging-release.apk
          asset_name: cloud-billr-staging-v${{ steps.version.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive
