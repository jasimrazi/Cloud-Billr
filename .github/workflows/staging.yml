name: Build Flutter App (Staging)

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build APK for Staging
        run: flutter build apk --flavor staging -t lib/main.dart

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: staging-v${{ steps.version.outputs.version }}
          name: Staging Release v${{ steps.version.outputs.version }}
          body: |
            Staging build from commit ${{ github.sha }}
            
            **Version:** ${{ steps.version.outputs.version }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: true
          files: build/app/outputs/flutter-apk/app-staging-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
